name: Compile icon appearances
on:
  push:
    paths: ['Assets.xcassets/**', '.github/workflows/icons.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: icons
  cancel-in-progress: true
jobs:
  compile:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Compile with Apple tools
        run: |
          mkdir -p compiled
          xcodebuild -version
          xcrun actool Assets.xcassets --compile compiled --platform iphoneos --minimum-deployment-target 18.0 --target-device iphone --app-icon AppIcon --output-partial-info-plist compiled/IconInfo.plist --output-format human-readable-text
          test -s compiled/Assets.car
          xcrun assetutil --info compiled/Assets.car > compiled/catalog-info.json
          shasum -a 256 compiled/Assets.car > compiled/SHA256.txt
      - name: Save compiled output without artifact storage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compiled/
          if ! git diff --cached --quiet; then
            git commit -m "Compile light dark and tinted icon catalog"
            git push
          fi
